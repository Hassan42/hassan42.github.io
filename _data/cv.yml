        highlights:
          - Designed BPMN4BC, a model-driven extension of the BPMN standard for blockchain-aware process modelling, and built a compiler that turns BPMN XML into deployable Solidity smart contracts.
          - Researched and implemented a transparent transaction-ordering mechanism resistant to maximal extractable value attacks for multi-party blockchain workflows, validated on an Ethereum Virtual Machine test network.
          - Configured a Hyperledger Fabric network with certificate authorities, peer nodes and organisational membership services, and implemented chaincode to execute a business process.
          - Validated tools empirically through a usability study with 50+ participants and a ground-truth oracle mined from open-source repositories.
          - Published eight peer-reviewed papers and presented at international venues including BPM, ICSOC and EuroPLoP.

